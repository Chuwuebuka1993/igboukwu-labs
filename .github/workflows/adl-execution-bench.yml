name: ADL Execution Bench

on:
  workflow_dispatch:
    inputs:
      command:
        description: "Approved bench command"
        required: true
        type: choice
        options:
          - npm test
          - node --test src/autonomy/*.test.js
      branch:
        description: "Branch to test"
        required: true
        default: "master"
        type: string

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Execute governed command
        shell: bash
        run: |
          set -o pipefail
          case "${{ inputs.command }}" in
            "npm test") npm test ;;
            "node --test src/autonomy/*.test.js") node --test src/autonomy/*.test.js ;;
            *) echo "Command is not allowlisted"; exit 2 ;;
          esac
