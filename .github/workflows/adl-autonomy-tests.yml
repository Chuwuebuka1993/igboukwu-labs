name: ADL autonomy tests

on:
  pull_request:
    paths:
      - "src/autonomy/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/adl-autonomy-tests.yml"
  push:
    branches:
      - "autonomous/**"
    paths:
      - "src/autonomy/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/adl-autonomy-tests.yml"

permissions:
  contents: read

jobs:
  autonomy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run ADL test suite
        run: npm test
      - name: Generate commit-pinned repository snapshot
        run: node scripts/adl/create-repository-snapshot.mjs
      - name: Upload repository snapshot evidence
        uses: actions/upload-artifact@v4
        with:
          name: adl-repository-snapshot
          path: artifacts/adl-repository-snapshot.json
          if-no-files-found: error
          retention-days: 14
